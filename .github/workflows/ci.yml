name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome checks
        run: biome ci .

  test:
    name: Tests
    runs-on: ubuntu-latest
    # A test that blocks on stdin used to be able to wedge the job until the
    # 6-hour default; the runner's --test-timeout is the first line of defence
    # and this is the second.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests with coverage
        # Discovery lives in scripts/run-tests.mjs so this job cannot drift out
        # of sync with what `npm test` runs locally.
        run: npx c8 --reporter=lcov --reporter=text node scripts/run-tests.mjs

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
